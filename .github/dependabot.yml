version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      time: "19:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # quartodoc passes parse_numpy an argument that griffe 2 removed
      - dependency-name: griffe
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "19:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
