                  href: app/app_cookbook/index-loaders.qmd
                  contents:
                    - app/app_cookbook/load-aligned.qmd
                    - app/app_cookbook/load-unaligned.qmd
                    - app/app_cookbook/load-tabular.qmd
                    - app/app_cookbook/load-json.qmd
                - section: "Sequence Alignment"
                  href: app/app_cookbook/index-align.qmd
