format:
  html:
    # declaring both variants makes quarto render a light/dark toggle in the
    # navbar, which the pydata-themed sphinx site also had. Must match
    # cogent3.org's doc/_quarto.yml or the toggle state and colours change as
    # you cross the /doc/ boundary.
    theme:
      light: cosmo
      dark: darkly
    css: custom.css
    # page geometry is declared here rather than by overriding quarto's CSS
    # grid: quarto derives the responsive (mobile vs desktop, docked vs
    # floating) behaviour from these four values, and hand-writing
    # grid-template-columns discards that. Must match cogent3.org's
    # doc/_quarto.yml or the body column changes width across the /doc/ boundary.
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5em
    toc: true
    toc-depth: 4
    # cogent3 objects render their own styled HTML tables. Leave them untouched
    # rather than converting to Bootstrap tables, which forces full body width.
    html-table-processing: none

# API reference generated from numpydoc docstrings via griffe (static analysis).
# cogent3's top-level exports are lazy (__getattr__), so several are referenced
# by their real module path to be statically resolvable.
quartodoc:
  package: cogent3
  dir: reference
  parser: numpy
  title: API Reference
  sidebar: reference/_sidebar.yml
  options:
    include_inherited: true
  sections:
    - title: Loading data from file
      desc: Top-level functions for loading data.
      contents:
        - load_seq
        - load_aligned_seqs
        - load_unaligned_seqs
        - parse.table.load_delimited
        - core.table.load_table
        - core.tree.load_tree
        - core.annotation_db.load_annotations
    - title: Making cogent3 objects
      desc: Constructors from standard Python types.
      contents:
        - make_seq
        - core.alignment.make_aligned_seqs
        - core.alignment.make_unaligned_seqs
        - core.table.make_table
        - core.tree.make_tree
    - title: Getting commonly used types
      contents:
        - core.genetic_code.get_code
        - core.moltype.get_moltype
        - evolve.models.get_model
    - title: Listing builtins
      contents:
        - core.genetic_code.available_codes
        - core.moltype.available_moltypes
        - evolve.models.available_models
        - app.available_apps
    - title: Sequences
      desc: Biological sequence objects.
      contents:
        - core.sequence.Sequence
        - core.sequence.DnaSequence
        - core.sequence.RnaSequence
        - core.sequence.ProteinSequence
    - title: Sequence collections & alignments
      contents:
        - core.alignment.SequenceCollection
        - core.alignment.Alignment
        - core.alignment.Aligned
    - title: Sequence storage & views
      contents:
        - core.seq_storage.SeqsData
        - core.seq_storage.AlignedSeqsData
        - core.seqview.SeqView
        - core.seqview.SeqDataView
        - core.seqview.AlignedDataView
        - core.slice_record.SliceRecord
    - title: Annotations
      contents:
        - core.annotation.Feature
        - core.annotation_db.BasicAnnotationDb
        - core.annotation_db.GffAnnotationDb
        - core.annotation_db.GenbankAnnotationDb
    - title: Molecular types & alphabets
      contents:
        - core.moltype.MolType
        - core.genetic_code.GeneticCode
        - core.alphabet.CharAlphabet
        - core.alphabet.KmerAlphabet
        - core.alphabet.SenseCodonAlphabet
        - core.alphabet.PhredEncoding
    - title: Tables
      contents:
        - core.table.Table
        - core.table.Columns
        - parse.table.FilteringParser
    - title: Trees
      contents:
        - core.tree.PhyloNode
