project:
  type: website
  output-dir: _site
  # run every code cell with the working directory set to this project root
  # so that relative paths like "data/brca1-bats.fasta" resolve.
  execute-dir: project
  # data files are linked from the docs rather than referenced as markdown
  # images, so name them explicitly to have them copied into the output
  resources:
    - data/

# the kernel comes from the doc dependency group, so a plain ipykernel name
# resolves to whichever interpreter is running the build
jupyter: python3

execute:
  # only re-run a page when its source changes. _freeze/ is not committed, so
  # this is a local development convenience only and CI renders from scratch
  freeze: auto
  # intentional exception demos are marked per-cell with `#| error: true`;
  # any other cell error should fail the build (doctest-like safety)
  error: false

bibliography: cogent3.bib

website:
  title: "cogent3"
  favicon: images/c3-square.svg
  # This navbar is mirrored in the cogent3.org repo's doc/_quarto.yml.
  navbar:
    logo: images/c3-logo.svg
    logo-alt: "cogent3"
    # the logo is a cogent3 wordmark and is itself a link home
    title: false
    logo-href: /index.html
    search: true
    left:
      # no "Home" entry -- the logo above is the link to the site root.
      - text: Image Gallery
        href: draw/index.qmd
      - text: Installation
        href: install.qmd
      - text: User Guides
        href: index.qmd
      - text: License
        href: licenses.qmd
      - text: Code Sharing
        href: ../codeshare.html
      - text: More
        menu:
          - text: Community
            href: community.qmd
          - text: Project History
            href: ../history.html
          - text: How does cogent3 relate to PyCogent?
            href: pycogent.qmd
          - text: Projects using cogent3
            href: ../projects.html
          - text: Data Files Used in the Documentation
            href: data_file_links.qmd
          - text: Index
            href: ../genindex.html
    tools:
      - icon: github
        href: https://github.com/cogent3/cogent3
        text: "cogent3 on GitHub"
  # pages are listed explicitly, in the order the sphinx toctrees defined. A
  # glob would sort them alphabetically and lose the teaching sequence
  sidebar:
    # Deliberately no `id:`. Quarto gives a page the `docked` grid only if it
    # belongs to a sidebar, and a page not listed in any sidebar inherits "the
    # first sidebar without an id or title". Leaving the id off therefore docks
    # the pages that are not listed below -- install, community,
    # data_file_links, pycogent, licenses, and the generated reference/*.qmd --
    # so body text starts at the same x on every page with no CSS overrides.
    # Adding an id here silently un-docks all of them.
    - style: docked
      search: true
      collapse-level: 1
      contents:
        - index.qmd
        - section: "Apps"
          href: app/index.qmd
          contents:
            - section: "Overview of apps"
              href: app/index-app.qmd
              contents:
                - app/app_overview/app-overview.qmd
                - app/app_overview/app-help.qmd
                - app/app_overview/app-get.qmd
