                    - app/app_cookbook/sample-omit-gap.qmd
                    - app/app_cookbook/sample-omit-bad.qmd
                    - app/app_cookbook/sample-omit-duplicated.qmd
                    - app/app_cookbook/sample-min-len.qmd
                    - app/app_cookbook/sample-fixed-len.qmd
                    - app/app_cookbook/sample-trim-stops.qmd
                    - app/app_cookbook/sample-take-pos.qmd
