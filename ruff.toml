exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "working",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["ALL"]
# ICN001 not adhering to numpy as np convention due to
# name collision, where np is used as num params
# N801 CamelCase is not always appropriate
# PLR0913 number of arguments sometimes needs to be > 5
# FBT001 and FBT002, positional boolean arguments are allowed!
# PT011, I disagree about checking error messages as well
# as exception types as it doubles the "cost" of fixing typos
ignore = [
    "COM812",
    "EXE002",
    "FA100",
    "E501",
    "D",
    "N801",
    "ICN001",
    "PLR0913",
    "FBT001",
    "FBT002",
    "PT011",
    "S311",    # Allow use of random
    "PLR2004", # Magic number usage where appropriate
    "PLC0415", # Allow delayed imports
    # naming, the maths and legacy API use non-PEP8 names
    "N802", # legacy camelCase methods in the public API
    "N803", # maths notation for arguments, e.g. Q, P
    "N806", # maths notation for locals, e.g. Q, P
    "E741", # l, I and O are meaningful in maths code
    # consistency with rules already ignored above
    "PLR0917", # positional-argument count, as for PLR0913
    "FBT003",  # positional booleans allowed, as for FBT001/FBT002
    "EXE001",  # shebangs need not be executable, as for EXE002
    # TODO bookkeeping is not enforced
    "TD002",
    "TD003",
    "TD004",
    "FIX002",
    # signatures are often fixed by an API or plugin contract
    "ARG001",
    "ARG002",
    "SLF001",  # private access within the package is intentional
    "PLW2901", # rebinding a loop variable is used deliberately
    "RUF059",  # unused unpacked variable
    "PT027",   # tests still migrating off unittest assertions
    # ruff preview rules that Codacy reports but we do not want
    # these cannot be triggered locally unless preview = true
    "CPY001", # no copyright header per file
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts allowed in tests...
    "INP001", # __init__.py files are not required...
    "ANN",
    "N802",
    "N803",
    "S608",   # sql injection unlikely
]
"noxfile.py" = [
    "S101",   # asserts allowed in tests...
    "INP001", # __init__.py files are not required...
    "ANN",
    "N802",
    "N803",
]

